<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Picker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎯 Who's Next?</h1>
        <p class="subtitle">Pick someone!</p>

        <div class="name-picker-container">
            <div class="names-list" id="namesList"></div>
        </div>

        <div class="controls">
            <button class="spin-btn" id="spinBtn">PICK!</button>
            <button class="reset-btn" id="resetBtn">Reset</button>
        </div>

        <div class="result hidden" id="result">
            <div class="result-label">Winner is:</div>
            <div class="result-text" id="resultText">-</div>
        </div>

        <a href="admin.html" style="color: aliceblue;" class="admin-link"> Admin Panel</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
